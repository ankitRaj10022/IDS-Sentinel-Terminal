[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ids-sentinel-terminal"
version = "0.2.2"
description = "Installable CLI and GUI for IDS Sentinel Terminal traffic analysis and local triage."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "IDS Sentinel Terminal Contributors" }
]
keywords = ["ids", "cli", "security", "network", "traffic-analysis", "threat-hunting"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/ankitRaj10022/IDS-Sentinel-Terminal"
Repository = "https://github.com/ankitRaj10022/IDS-Sentinel-Terminal"
Issues = "https://github.com/ankitRaj10022/IDS-Sentinel-Terminal/issues"

[project.scripts]
ids-sentinel = "ids_app.product_app:main"
ids-sentinel-terminal = "ids_app.product_app:main"
ids-sentinal = "ids_app.product_app:main"

[project.gui-scripts]
ids-sentinel-gui = "ids_app.product_app:gui_main"

[project.optional-dependencies]
app = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "joblib>=1.4,<1.5",
  "jinja2>=3.1,<3.2",
]
classical = [
  "numpy<2",
  "pandas>=1.5,<2.3",
  "scikit-learn>=1.3,<1.6",
  "joblib>=1.4,<1.5",
]
dnn = [
  "numpy<2",
  "pandas>=1.5,<2.3",
  "scikit-learn>=1.3,<1.6",
  "tensorflow==2.15.1",
  "h5py>=3.10,<4",
]
all = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "joblib>=1.4,<1.5",
  "jinja2>=3.1,<3.2",
  "numpy<2",
  "pandas>=1.5,<2.3",
  "scikit-learn>=1.3,<1.6",
  "tensorflow==2.15.1",
  "h5py>=3.10,<4",
]

[tool.setuptools.packages.find]
include = ["ids_app*"]

[tool.setuptools.package-data]
ids_app = ["assets/*"]
